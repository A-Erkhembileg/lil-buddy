name: Build apps

on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
    tags: ['v*']
    paths:
      - desktop_cat.py
      - requirements.txt
      - requirements-build.txt
      - tools/build_app.py
      - packaging/**
      - tests/**
      - .github/workflows/build-apps.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - licenses/**

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Record build dependencies
        shell: python
        env:
          BUILD_OS: ${{ runner.os }}
          BUILD_ARCH: ${{ runner.arch }}
        run: |
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys

          report = Path("build") / f"Lil-Buddy-Build-Info-{os.environ['BUILD_OS']}-{os.environ['BUILD_ARCH']}.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "python": sys.version,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "packages": dict(sorted((package.metadata["Name"], package.version)
                                      for package in importlib.metadata.distributions()
                                      if package.metadata["Name"])),
          }, indent=2) + "\n", encoding="utf-8")
      - name: Run checks
        run: python -B -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          LIL_BUDDY_SETTINGS_DIR: ${{ runner.temp }}/lil-buddy-tests
      - name: Build macOS application and installer
        if: runner.os == 'macOS'
        run: python tools/build_app.py --dmg
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python tools/build_app.py
      - name: Check the packaged application
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import json
          from pathlib import Path
          import subprocess
          import sys

          executable = Path("dist/Lil Buddy.exe") if sys.platform == "win32" else Path("dist/Lil Buddy.app/Contents/MacOS/Lil Buddy")
          report = Path("build/frozen-smoke.json").resolve()
          report.parent.mkdir(parents=True, exist_ok=True)
          command = [str(executable.resolve()), "--smoke-test", "--smoke-test-report", str(report)]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=45)
          finally:
              if report.exists():
                  print(report.read_text(encoding="utf-8"), flush=True)
              else:
                  print("The packaged application did not write its smoke-test report.", flush=True)
          if result.stdout:
              print(result.stdout, flush=True)
          if result.stderr:
              print(result.stderr, file=sys.stderr, flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          if not report.exists() or not json.loads(report.read_text(encoding="utf-8")).get("success"):
              raise SystemExit("The packaged application failed its startup checks.")
      - name: Upload installable artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lil-Buddy-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Lil-Buddy-*.zip
            dist/Lil-Buddy-*.dmg
            build/frozen-smoke.json
            build/Lil-Buddy-Build-Info-*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public downloads
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: lil-buddy-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Lil-Buddy-*
          path: release-artifacts
          merge-multiple: true
      - name: Prepare release version and checksums
        id: version
        shell: python
        run: |
          import ast
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          tree = ast.parse(Path("tools/build_app.py").read_text(encoding="utf-8"))
          version = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == "APP_VERSION"
                                 for target in node.targets))
          if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use major.minor.patch format.")
          tag = "v" + version
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("The pushed tag does not match APP_VERSION.")
          destination = Path("release-files")
          destination.mkdir()
          files = sorted(path for path in Path("release-artifacts").rglob("Lil-Buddy-*")
                         if path.is_file() and path.suffix in (".zip", ".dmg"))
          if len(files) != 5:
              raise SystemExit(f"Expected two macOS DMGs, two macOS ZIPs, and one Windows ZIP; got {len(files)} files.")
          for source in files:
              target = destination / source.name
              if target.exists():
                  raise SystemExit(f"Duplicate release filename: {source.name}")
              shutil.copyfile(source, target)
          # Keep the exact application source beside the binaries, independent
          # of GitHub's generated source downloads and their archive format.
          source_archive = destination / f"Lil-Buddy-Source-{tag}.zip"
          subprocess.run(["git", "archive", "--format=zip",
                          f"--prefix=lil-buddy-{tag}/", "HEAD",
                          "--output", str(source_archive)], check=True)
          manifests = sorted(Path("release-artifacts").rglob("Lil-Buddy-Build-Info-*.json"))
          if len(manifests) != 3:
              raise SystemExit(f"Expected one build dependency manifest per platform; got {len(manifests)}.")
          for manifest in manifests:
              shutil.copyfile(manifest, destination / manifest.name)
          checksums = "".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
                              for path in sorted(destination.iterdir()))
          (destination / "SHA256SUMS.txt").write_text(checksums, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
      - name: Publish a new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and was left unchanged. Increase APP_VERSION for a new release."
            exit 0
          fi
          if existing_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            if [ "$existing_commit" != "$RELEASE_COMMIT" ]; then
              echo "Tag $RELEASE_TAG already points to another commit; refusing to publish mismatched binaries." >&2
              exit 1
            fi
          fi
          cat > release-notes.md <<'NOTES'
          A pixel-art desktop companion for macOS and Windows, with Cat, Crow, Dog, and Fox.

          Download the DMG for your Mac: arm64 for Apple Silicon, x86_64 for Intel. On Windows, extract the Windows ZIP and run Lil Buddy.exe. Python is not required for these downloads.

          Left-click to pet, drag to pick up, and right-click for animals, colors, sizes, and controls. Crow can take flight. Use the menu-bar/system-tray icon to pause, show, hide, or quit.

          These preview builds are not notarized or signed with a paid developer certificate. The operating system may require approval on first launch. The Source ZIP contains the exact application source used to build this release; the Build Info JSON files record each platform's dependency versions. See THIRD_PARTY_NOTICES.md and the included dependency notices for dependency licenses and sources. SHA256SUMS.txt lists download checksums.
          NOTES
          gh release create "$RELEASE_TAG" release-files/* \
            --target "$RELEASE_COMMIT" \
            --title "Lil Buddy $RELEASE_TAG" \
            --notes-file release-notes.md
